Meta:
  num_objs: 2

Environment:
  dimensions: [20, 20]
  ep_length: 25
  timestep_penalty: 0

  global_reward_mode: "Aggregated"
  local_reward_mode: "exponential"
  local_reward_kneecap: 10.0
  local_reward_temp: 2

  observation_mode: "density"
  poi_obs_temp: 2
  agent_obs_temp: 2
  include_location_in_obs: False

  pois:
      # Objective 0
      - obj: 0
        location: [6, 7]
        radius: 1.5
        coupling: 2
        obs_window: [0, 100]
        reward: 1
        repeat: True

      - obj: 0
        location: [14, 13]
        radius: 1.5
        coupling: 2
        obs_window: [0, 100]
        reward: 5
        repeat: True

      # Objective 1
      - obj: 1
        location: [6, 13]
        radius: 1.5
        coupling: 2
        obs_window: [0, 100]
        reward: 1
        repeat: True

      - obj: 1
        location: [14, 7]
        radius: 1.5
        coupling: 2
        obs_window: [0, 100]
        reward: 5
        repeat: True

POI_Generation:
  mode: "fixed"

Agents:
  num_agents: 4
  start_mode: fixed

  starting_locs:
    - [9, 9]
    - [11, 9]
    - [9, 11]
    - [11, 11]

  num_sensors: [4, 4, 4, 4]
  observation_radii: [5, 5, 5, 5]
  max_step_sizes: [1, 1, 1, 1]
